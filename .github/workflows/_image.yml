# 재사용 — 컨테이너 이미지 빌드 (linux/arm64) → GHCR, 버전이 있으면 GitHub Release
#
# 배포 대상이 arm64 라 네이티브 arm64 러너에서 arm64 만 빌드한다
# (구 pi-finances 는 amd64 + QEMU arm64 — 에뮬레이션 빌드는 pnpm install 이 몇 배 느리다).
#
# 태그 규칙
#   version=v1.2.3  → 1.2.3, 1.2, sha-<short>
#   latest=true     → + latest
#   그 외           → sha-<short>
# 라벨(org.opencontainers.image.source 등)이 GHCR 패키지를 저장소에 연결한다.
#
# 푸시 전에 Trivy 로 이미지를 검사한다 (OS·npm 패키지의 HIGH/CRITICAL, 고칠 버전이 있는 것만).
# 결과는 로그·잡 요약에 남기고 빌드를 막지는 않는다 — 고칠 수 없는 베이스 이미지 취약점으로 배포가 막히지 않게.

name: image

on:
  workflow_call:
    inputs:
      ref:
        description: "빌드할 ref (비우면 워크플로를 발화한 커밋)"
        type: string
        default: ""
      push:
        description: "GHCR 에 푸시할지 (PR 은 false — 빌드만 해서 Dockerfile 회귀를 잡는다)"
        type: boolean
        default: false
      version:
        description: "릴리스 태그 (예: v1.2.3). 있으면 semver 이미지 태그 + GitHub Release"
        type: string
        default: ""
      latest:
        description: "latest 태그를 붙일지"
        type: boolean
        default: false

permissions:
  contents: write # GitHub Release
  packages: write # GHCR 푸시

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context: git — sha 태그·revision 라벨을 **체크아웃한 커밋** 기준으로 만든다.
      # bump 경로에서는 워크플로를 발화한 커밋(버전 올리기 전)과 빌드하는 커밋(릴리스 커밋)이 다르다.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.latest }}
            type=sha,format=short

      # 푸시 전에 같은 캐시로 로컬 이미지를 만들어 검사한다 (두 번째 빌드는 캐시 적중)
      - name: build for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/arm64
          load: true
          tags: alphafolio:scan
          cache-from: type=gha

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 — 서드파티라 SHA 로 고정 (2026-03 태그 변조 사고)
        continue-on-error: true
        with:
          image-ref: alphafolio:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1" # continue-on-error 와 함께 — 발견 시 단계만 실패로 표시된다
          format: table
          output: trivy.txt

      - name: Trivy summary
        if: always()
        run: |
          [ -f trivy.txt ] || exit 0
          { echo '### Trivy (HIGH/CRITICAL, fixable)'; echo '```'; cat trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release
        if: inputs.push && inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # 태그를 다시 밀어 재실행된 경우 — 릴리스가 이미 있으면 이미지만 다시 푸시한 것으로 끝낸다
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "릴리스 $VERSION 이미 있음 — 이미지만 다시 푸시했다"
            exit 0
          fi
          gh release create "$VERSION" --verify-tag --generate-notes
          BODY=$(gh release view "$VERSION" --json body -q .body)
          gh release edit "$VERSION" --notes "$(cat <<EOF
          ${BODY}

          ---
          ### Docker 이미지 (linux/arm64)
          \`\`\`
          docker pull ${IMAGE}:${VERSION#v}
          \`\`\`
          digest: \`${DIGEST}\`
          EOF
          )"
