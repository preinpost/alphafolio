# CI — 검사 + 컨테이너 이미지
#
# pi-finances 의 ci.yml · release-pi-finance-container.yml 을 이 저장소 구조에 맞춰 합쳤다.
#
#   check  모든 PR·푸시 (_check.yml)
#   image  check 통과 후 (_image.yml). PR 은 빌드만, main → latest, v* 태그 수동 푸시 → semver + Release
#
# 버전 릴리스는 보통 Actions 의 "Bump & release"(bump.yml)로 한다. 거기서 만든 태그는 GITHUB_TOKEN
# 제약으로 이 워크플로를 발화하지 않으므로, bump.yml 이 _check·_image 를 직접 호출한다.
# 이 파일의 v* 경로는 태그를 손으로 밀 때를 위한 것이다.
#
# 구 워크플로에서 뺀 것:
#   - npm 패키지 릴리스 후속(workflow_run) 과 containers/VERSION 자동 범프 — 이 저장소는 npm 패키지를 내지 않는다
#   - tarball(workspace:*) 검사 — 배포하는 npm 패키지가 없다

name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE"]
  push:
    branches: [main]
    tags: ["v*"] # 태그 푸시에는 paths 필터가 적용되지 않는다
    paths-ignore: ["**/*.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR 은 새 커밋이 오면 이전 런을 취소, main·태그는 끝까지 (이미지 푸시가 중간에 끊기지 않게)
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: ./.github/workflows/_check.yml

  image:
    needs: check
    uses: ./.github/workflows/_image.yml
    permissions:
      contents: write
      packages: write
    with:
      push: ${{ github.event_name != 'pull_request' }}
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      latest: ${{ github.ref == 'refs/heads/main' }}
