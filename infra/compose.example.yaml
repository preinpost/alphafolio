# AlphaFolio — 운영 compose 템플릿 (이 파일 하나로 관리한다)
#
#   cp <repo>/infra/compose.example.yaml compose.yaml && chmod 600 compose.yaml
#   # 아래 environment 의 빈 값을 채운다 — 비밀이 들어가므로 compose.yaml 은 git 에 넣지 않는다
#   docker compose up -d
#
#   버전 올리기   image 태그만 바꾸고 docker compose up -d
#   로그          docker compose logs -f app
#   중지          docker compose down                (대화 볼륨은 남는다)
#
# 템플릿이 바뀌면 서버의 compose.yaml 과 비교해서 반영한다:
#   diff <(grep -v '^\s*#' compose.yaml) <(grep -v '^\s*#' <repo>/infra/compose.example.yaml)
#
# ⚠️ compose.yaml 안의 $ 는 변수로 해석된다. 값에 $ 가 있으면 $$ 로 적는다.
#
# 컨테이너는 평문 HTTP 만 연다. TLS·도메인은 앞단(리버스 프록시·터널)이 맡는다.
name: alphafolio

services:
  app:
    # 금융 앱이라 latest 대신 버전을 고정한다 (Actions → Bump & release 로 나온 버전)
    # 로컬 빌드로 띄우려면: image: alphafolio:local + pull_policy: missing  (task docker:build)
    image: ghcr.io/preinpost/alphafolio:latest
    pull_policy: always
    init: true              # PID 1 = tini — 시그널·좀비 처리
    restart: unless-stopped
    ports:
      # 루프백에만 연다 — 같은 호스트의 프록시·터널만 들어온다.
      # 0.0.0.0 으로 열면 프록시를 거치지 않고 붙을 수 있어 AF_TRUST_PROXY=1 을 쓰면 안 된다.
      - "127.0.0.1:8080:8080"
    volumes:
      - data:/data          # 대화 세션. 가계부·계정·개인 키는 D1 에 있다
      # 웹 검색 확장 설정 (검색 프로바이더 키 포함). 파일이 없으면 Docker 가 디렉터리를 만들어 버리므로
      # 안 쓰면 이 줄을 지우거나 빈 설정을 둔다:  echo '{}' > web-search.json && chmod 600 web-search.json
      - ./web-search.json:/app/agent-config/web-search.json:ro
      # LLM 을 API 키 대신 호스트의 pi 로그인(OAuth)으로 쓸 때 — 아래 AF_PI_AUTH_PATH 와 함께
      # - ${HOME}/.pi/agent/auth.json:/secrets/auth.json:ro

    environment:
      # ── 인증 ────────────────────────────────────────────────────────
      # 토큰 서명 + D1 에 저장되는 사용자별 키(증권·LLM)의 암호화 마스터.
      # 반드시 고정. 바꾸면 모든 로그인이 끊기고, 이미 저장된 개인 키를 읽을 수 없게 된다.
      #   생성: openssl rand -hex 32
      AF_AUTH_SECRET: ""

      # 슈퍼관리자 (한 명) — 초대 코드 발급·계정 관리. 다른 사람은 앱에서 초대 코드로 가입한다.
      # 평문이다: 이 파일에 AF_AUTH_SECRET·D1 토큰이 이미 평문으로 있어 해시로 감춰도 막아주는 게 없다.
      # 다른 곳에서 쓰지 않는 비밀번호로. 바꾸고 재시작하면 기존 관리자 로그인이 모두 끊긴다.
      #   생성: openssl rand -base64 18
      AF_ADMIN_USER: admin
      AF_ADMIN_PASSWORD: ""

      # ── 가계부·계정·개인 키 DB (Cloudflare D1) ──────────────────────
      AF_D1_ACCOUNT_ID: ""
      AF_D1_DATABASE_ID: ""
      AF_D1_TOKEN: ""

      # ── 모델 ────────────────────────────────────────────────────────
      AF_DEFAULT_MODEL: openrouter/deepseek/deepseek-v4.1-flash
      # 사고 강도 off/minimal/low/medium/high/xhigh/max
      AF_DEFAULT_THINKING: high
      # 서버 기본 LLM 키. 사용자가 설정 화면에 자기 키를 넣으면 그게 우선한다.
      OPENROUTER_API_KEY: ""
      # 대신 호스트 pi 로그인을 쓰려면 위 auth.json 마운트를 켜고:
      # AF_PI_AUTH_PATH: /secrets/auth.json

      # ── 네트워크 ────────────────────────────────────────────────────
      # 프록시·터널 뒤에서만 "1". 로그인·가입 시도 제한이 실제 클라이언트 IP 로 센다
      AF_TRUST_PROXY: "1"
      # iOS 앱 오리진 (비우면 capacitor://localhost)
      # AF_CORS_ORIGINS: capacitor://localhost

      # ── 선택 ────────────────────────────────────────────────────────
      # 유휴 대화를 메모리에서 내리는 기준(분). 응답 중인 대화는 기준과 무관하게 끝까지 돈다
      # AF_IDLE_MINUTES: "60"
      # KIS 모의투자 (모의계좌는 별도 앱키)
      # AF_KIS_ENV: paper
      # 일별 포트폴리오 스냅샷 끄기
      # AF_SNAPSHOT_DISABLED: "1"

      # ⚠️ 증권(KIS·토스)·뉴스 키는 여기 넣지 않는다 — env 값은 모든 사용자의 공통 기본값이 된다.
      #    각자 앱의 설정 → 연결 탭에서 입력한다 (D1 에 사용자별로 암호화 저장).

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
