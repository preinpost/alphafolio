<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#f6f8fa" />
		<!-- 웹폰트 (styles.css @import) — 연결을 미리 열어 첫 글자가 늦게 바뀌지 않게 -->
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="icon" type="image/png" href="/favicon-64.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<title>AlphaFolio</title>
		<script>
			// 첫 페인트 전에 테마를 적용한다 (번쩍임 방지).
			// 키·값·색은 src/lib/theme.ts 와 일치해야 한다.
			(function () {
				try {
					var mode = localStorage.getItem("af_theme") || "system";
					var dark =
						mode === "dark" ||
						(mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
					if (dark) document.documentElement.classList.add("dark");
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute("content", dark ? "#090f16" : "#f6f8fa");
				} catch (e) {}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
